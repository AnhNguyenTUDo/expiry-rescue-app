# Application
spring.application.name=expiry-rescue-app
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/expiry_rescue_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# Set JWT_SECRET environment variable in .env file
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Firebase
firebase.config.path=classpath:firebase-service-account.json
firebase.storage.bucket=your-project-id.appspot.com

# CORS
cors.allowed.origins=http://localhost:3000

# Frontend URL for OAuth2 redirects
frontend.url=http://localhost:3000

# Logging
logging.level.practice.expiry_rescue_app=DEBUG
logging.level.org.springframework.security=DEBUG

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Email (SMTP) - only used when app.mail.enabled=true
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Passwordless OTP
# app.mail.enabled=false -> codes are logged to the console (dev). true -> sent via SMTP above.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@expiryrescue.app}
app.otp.length=6
app.otp.ttl-seconds=600
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# For colorful console output
spring.output.ansi.enabled=ALWAYS